name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build GitHub Pages bundle
        env:
          VITE_PAGES_BUILD: '1'
          VITE_API_BASE: 'https://tmdb-player.yuclark-kino.workers.dev'
        run: |
          npx vite build
          cp dist-pages/index.html dist-pages/404.html
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          keep_files: false
